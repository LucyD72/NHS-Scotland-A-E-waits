name: Update NHS Scotland A&E data

on:
  schedule:
    - cron: "0 9 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Download latest PHS data
        run: python update_ae_data.py

      - name: Check whether data changed
        id: data-changes
        run: |
          if git diff --quiet -- ae_waiting_times.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new A&E data."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "A&E data has changed."
          fi

      - name: Commit updated CSV
        if: steps.data-changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ae_waiting_times.csv
          git commit -m "Update NHS Scotland A&E data"
          git push

      - name: Republish Datawrapper chart
        if: steps.data-changes.outputs.changed == 'true'
        env:
          DATAWRAPPER_API_TOKEN: ${{ secrets.DATAWRAPPER_API_TOKEN }}
        run: |
          curl --fail-with-body \
            --request POST \
            --url "https://api.datawrapper.de/v3/charts/eyGvs/publish" \
            --header "Authorization: Bearer $DATAWRAPPER_API_TOKEN"

      - name: Email notification
        if: steps.data-changes.outputs.changed == 'true'
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: NHS Scotland A&E data updated
          to: ${{ secrets.GMAIL_ADDRESS }}
          from: NHS Scotland A&E data updater
          body: |
            Public Health Scotland A&E data has changed.

            The GitHub CSV has been updated and the Datawrapper chart has been republished.

            Repository:
            https://github.com/LucyD72/NHS-Scotland-A-E-waits
